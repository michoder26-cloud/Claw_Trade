version: '3'
services:
  mt5:
    image: gmag11/metatrader5_vnc
    container_name: claw-trade-mt5
    restart: unless-stopped
    ports:
      - "3000:3000"   # VNC Web UI (สำหรับล็อกอิน MT5 ครั้งแรก)
      - "8001:8001"   # RPyC API (สำหรับ Python bot)
    volumes:
      - mt5_config:/config
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=change_me_pls
      # MT5 auto-login (optional - uncomment and fill in)
      # - MT5_CMD_OPTIONS=/config:C:\config\mt5.ini
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  mt5_config: