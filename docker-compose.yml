version: '3.8'

services:
  xau-trading-system:
    build: .
    container_name: xau-trading-bot
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      INITIAL_BALANCE: ${INITIAL_BALANCE:-10000}
      POSITION_SIZE_PERCENT: ${POSITION_SIZE_PERCENT:-2}
      MAX_DRAWDOWN_PERCENT: ${MAX_DRAWDOWN_PERCENT:-10}
      BACKTESTING_START_DATE: ${BACKTESTING_START_DATE:-2023-01-01}
      BACKTESTING_END_DATE: ${BACKTESTING_END_DATE:-2024-12-31}
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
